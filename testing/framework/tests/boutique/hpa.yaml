apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue  
        averageValue: 50m
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 
      selectPolicy: Max
      policies:
      - type: Percent
        value: 900   
        periodSeconds: 15
      - type: Pods
        value: 10    
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300 
      selectPolicy: Min
      policies:
      - type: Percent
        value: 10  
        periodSeconds: 60
---
