apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  schedulerName: topsis-scheduler
  restartPolicy: Never
  containers:
  - name: stress
    image: polinux/stress-ng
    command: ["stress-ng"]
    args: ["--cpu", "1", "--cpu-load", "10"] 
    resources:
      requests:
        cpu: "1000m" 