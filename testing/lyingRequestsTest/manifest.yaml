apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  schedulerName: topsis-scheduler
  restartPolicy: Never
  containers:
  - name: stress
    image: polinux/stress-ng
    command: ["stress-ng"]
    args:
      - "--cpu"
      - "1"
      - "--cpu-load"
      - "10"             
      - "--timeout"
      - "1000s"
    resources:
      requests:
        cpu: "500m"     
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "128Mi"